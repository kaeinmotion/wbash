[package]
name = "w-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libfuzzer-sys = "0.4"
tempfile = "3"

[dependencies.wxec-core]
path = "../crates/wxec-core"

[dependencies.wxec-parsers]
path = "../crates/wxec-parsers"

[[bin]]
name = "args"
path = "fuzz_targets/args.rs"
test = false
doc = false
bench = false

[[bin]]
name = "paths"
path = "fuzz_targets/paths.rs"
test = false
doc = false
bench = false

[[bin]]
name = "parsers"
path = "fuzz_targets/parsers.rs"
test = false
doc = false
bench = false

[[bin]]
name = "formatter"
path = "fuzz_targets/formatter.rs"
test = false
doc = false
bench = false

[workspace]
