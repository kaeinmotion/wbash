[workspace]
resolver = "2"
members = ["crates/wxec-core", "crates/wxec-index", "crates/wxec-parsers", "crates/wxec-tools", "crates/wxec-adapters", "crates/wxec-cli"]
exclude = ["fuzz"]

[workspace.package]
version = "0.2.14"
edition = "2021"
license = "MIT"
repository = "https://github.com/kaeinmotion/wxec.git"
readme = "README.md"
authors = ["wxec contributors"]
[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
blake3 = "1"
regex = "1"
ignore = "0.4"
globset = "0.4"
similar = "2.6"
libc = "0.2"
tree-sitter = "0.24"
tree-sitter-rust = "0.23"
tree-sitter-typescript = "0.23"
tree-sitter-python = "0.23"
tree-sitter-go = "0.23"
tempfile = "3"
tiktoken-rs = "0.12"

[profile.release]
lto = "thin"
codegen-units = 1
