name: ci

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1"

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  fmt-clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --workspace --all-targets
      - name: unit + golden + invariants + differential + schema budget
        run: cargo test --workspace
      - name: schema budget
        run: cargo test -p wxec-adapters --test mcp -- --nocapture

  estimator-calibration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p wxec-core --test calibration -- --nocapture
      - name: regenerated corpus is current
        run: |
          cargo run -q -p wxec-core --example calibrate -- --write-expected
          git diff --exit-code corpus/expected/estimator.json

  bench-scripted:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release -p wxec-cli
      - run: python3 bench/run.py --runners bash,w --w-bin target/release/w --baseline bench/baselines/v0.2.3-baseline.json --max-regress-pct 10 --save-baseline bench/results/ci-baseline.json
      - uses: actions/upload-artifact@v4
        with:
          name: bench-results
          path: bench/results/ci-baseline.json

  perf-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release -p wxec-cli
      - run: mkdir -p bench/results
      - name: latency smoke (CLI advisory)
        run: python3 bench/perf.py --w-bin target/release/w | tee bench/results/perf.txt
      - name: warm in-process gates G6-G8
        env:
          WXEC_PERF_FILES: "10000"
        run: python3 bench/warm_gate.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: perf-smoke
          path: bench/results/perf.txt


  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: confinement, tier, redaction, and invariant checks
        run: |
          cargo test -p wxec-core --test core --test properties -- --nocapture
          cargo test -p wxec-tools --test invariants -- --nocapture
          cargo test -p wxec-adapters --test mcp -- --nocapture


  fuzz-smoke:
    if: github.event_name == 'pull_request' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
      - run: cargo install cargo-fuzz --locked
      - run: cargo fuzz build
      - name: fuzz args
        run: cargo fuzz run args -- -runs=10000 -max_total_time=120
      - name: fuzz paths
        run: cargo fuzz run paths -- -runs=10000 -max_total_time=120
      - name: fuzz parsers
        run: cargo fuzz run parsers -- -runs=10000 -max_total_time=120
      - name: fuzz formatter
        run: cargo fuzz run formatter -- -runs=10000 -max_total_time=120


  fuzz-quick:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
      - run: cargo install cargo-fuzz --locked
      - run: cargo fuzz build
      - run: cargo fuzz run args -- -runs=2000 -max_total_time=30
      - run: cargo fuzz run paths -- -runs=2000 -max_total_time=30
      - run: cargo fuzz run parsers -- -runs=2000 -max_total_time=30
      - run: cargo fuzz run formatter -- -runs=2000 -max_total_time=30
